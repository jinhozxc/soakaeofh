<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>풀숲을 조심해</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:100%;display:block;border-radius:8px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;text-align:center;padding:20px;box-sizing:border-box;border-radius:8px}
.ov.hide{display:none}
.ov h1{font-size:34px;margin:0 0 8px;text-shadow:0 3px 0 #2e7d32}
.ov p{margin:6px 0;font-size:15px;line-height:1.5}
.big{font-size:44px;margin:6px 0}
button{margin-top:18px;font:inherit;font-size:20px;font-weight:bold;padding:12px 34px;border:0;border-radius:30px;background:#ffca28;color:#4e342e;cursor:pointer;box-shadow:0 4px 0 #c79100}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #c79100}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="400" height="640"></canvas>
  <div id="start" class="ov">
    <div class="big">🦁🌿</div>
    <h1>풀숲을 조심해</h1>
    <p>풀숲에서 날아오는 공격을 피하세요!</p>
    <p>PC: 방향키 / WASD / 마우스 드래그<br>폰: 화면을 드래그</p>
    <button id="startBtn">시작하기</button>
  </div>
  <div id="over" class="ov hide">
    <div class="big">💥</div>
    <h1>게임 오버</h1>
    <p>생존 시간</p>
    <p id="score" style="font-size:32px;font-weight:bold;color:#ffd54a"></p>
    <button id="retryBtn">다시 하기</button>
  </div>
</div>
<script>
const W=400,H=640,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.width=W*s+'px';wrap.style.height=H*s+'px'}
addEventListener('resize',fit);fit();

let bushes=[],bushLvl=0;
const STARS=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*190,p:Math.random()*6}));
let st='start',t=0,lives=1,px=200,py=520,proj=[],keys={},spawnT=1,n=0,hurt=0,clock=0;

function addBush(){
  if(bushes.length>=16)return;
  for(let i=0;i<60;i++){
    const a=Math.random()*Math.PI*2,x=200+Math.cos(a)*165,y=420+Math.sin(a)*165;
    if(bushes.every(b=>Math.hypot(b.x-x,b.y-y)>45)){bushes.push({x,y,shake:0});return}
  }
}
function reset(){t=0;lives=1;px=200;py=420;proj=[];spawnT=1;hurt=0;bushes=[];bushLvl=0;for(let i=0;i<3;i++)addBush()}
function begin(){reset();st='play';document.getElementById('start').classList.add('hide');document.getElementById('over').classList.add('hide')}
function end(){st='over';document.getElementById('score').textContent=t.toFixed(1)+'초';document.getElementById('over').classList.remove('hide')}
document.getElementById('startBtn').onclick=begin;
document.getElementById('retryBtn').onclick=begin;

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{
  if(!drag||st!=='play')return;
  const s=cv.getBoundingClientRect().width/W;
  px+=(e.clientX-drag.x)/s;py+=(e.clientY-drag.y)/s;drag={x:e.clientX,y:e.clientY};
});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>drag=null));

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function mix(a,b,k){const f=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const x=f(a),y=f(b);
  return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*k)).join(',')+')'}

function spawn(lvl){
  const act=bushes.filter(s=>Math.hypot(s.x-px,s.y-py)>=120);
  if(!act.length)return;
  const b=act[Math.floor(Math.random()*act.length)];
  const a=Math.atan2(py-b.y,px-b.x)+(Math.random()-.5)*.25,sp=170+lvl*22;
  proj.push({x:b.x,y:b.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:0});
  b.shake=.3;
}

function update(dt){
  t+=dt;const lvl=Math.floor(t/3);if(lvl>bushLvl){bushLvl=lvl;addBush()}
  let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
  let dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(dx&&dy){dx*=.707;dy*=.707}
  px+=dx*240*dt;py+=dy*240*dt;
  px=clamp(px,20,W-20);py=clamp(py,230,620);
  spawnT-=dt;if(spawnT<=0){spawn(lvl);spawnT=.9}
  for(let i=proj.length-1;i>=0;i--){
    const p=proj[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=dt*8;
    if(Math.hypot(p.x-px,p.y-py)<24){proj.splice(i,1);lives--;hurt=.4;if(lives<=0){end();return}continue}
    if(p.x<-20||p.x>W+20||p.y>H+20||p.y<-20){
      proj.splice(i,1);
    }
  }
  hurt=Math.max(0,hurt-dt);
  bushes.forEach(s=>s.shake=Math.max(0,s.shake-dt));
}

function emoji(ch,x,y,size,alpha=1,rot=0){
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot);
  ctx.font=size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(ch,0,0);ctx.restore();
}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,200);
  g.addColorStop(0,mix('#5bb8ff','#070b24',n));g.addColorStop(1,mix('#d6f1ff','#2b3170',n));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,200);
  // 별
  STARS.forEach(s=>{ctx.globalAlpha=n*(.5+.5*Math.sin(clock*2+s.p));ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,2,2)});
  ctx.globalAlpha=1;
  // 무지개
  if(n<.99){
    ['#ff5252','#ffab40','#ffee58','#66bb6a','#42a5f5','#7e57c2'].forEach((c,i)=>{
      ctx.globalAlpha=.55*(1-n);ctx.strokeStyle=c;ctx.lineWidth=7;
      ctx.beginPath();ctx.arc(220,215,150-i*7,Math.PI,0);ctx.stroke();
    });
    ctx.globalAlpha=1;
  }
  emoji('☀️',55,50,44,1-n);emoji('🌙',340,50,44,n);
  emoji('☁️',150+Math.sin(clock*.3)*20,60,40,.9*(1-n));
  // 사바나 땅
  ctx.fillStyle=mix('#dcb862','#4d4126',n);ctx.fillRect(0,200,W,H-200);
  ctx.fillStyle=mix('#c9a24c','#3f351f',n);
  for(let i=0;i<14;i++)ctx.fillRect((i*83)%W,270+(i*61)%350,26,3);
  // 아카시아 나무
  [[70,205],[330,203]].forEach(([x,y])=>{
    ctx.fillStyle=mix('#6d4c2a','#2a1f14',n);ctx.fillRect(x-3,y-30,6,32);
    ctx.fillStyle=mix('#5f9c3a','#1d3a22',n);ctx.beginPath();ctx.ellipse(x,y-34,34,11,0,0,7);ctx.fill();
  });
}

function drawBush(s){
  const ox=s.shake>0?Math.sin(clock*60)*3:0;
  ctx.save();ctx.translate(s.x+ox,s.y);
  ctx.fillStyle=mix('#2e7d32','#12301a',n);
  [[-14,4,15],[0,-4,18],[14,4,15]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()});
  ctx.fillStyle=mix('#43a047','#1b4a26',n);
  [[-6,-8,6],[10,0,5]].forEach(([x,y,r])=>{ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()});
  ctx.restore();
}

function drawBadge(){
  const d=Math.floor(t/10),x=10,y=10,w=140,h=38;
  ctx.save();
  if(d>=2){ctx.shadowColor='#ffd54a';ctx.shadowBlur=12+Math.sin(clock*4)*4}
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(x,y,w,h,12);ctx.fill();
  ctx.shadowBlur=0;
  if(d>=1){
    let c='#ffd54a';
    if(d>=4){const g=ctx.createLinearGradient(x,0,x+w,0);
      ['#ff5252','#ffee58','#66bb6a','#42a5f5','#7e57c2'].forEach((cc,i)=>g.addColorStop(i/4,cc));c=g}
    ctx.strokeStyle=c;ctx.lineWidth=3;ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('⏱ '+t.toFixed(1)+'초',x+w/2,y+h/2+1);
  if(d>=3){emoji('⭐',x+4,y+4,16);emoji('⭐',x+w-4,y+h-4,16)}
  if(d>=5)emoji('👑',x+w/2,y-4,22);
  if(d>=6){emoji('✨',x+w+14+Math.sin(clock*3)*4,y+h/2,20);emoji('🌟',x-2,y+h,16)}
}

function draw(){
  drawBg();
  const lvl=Math.floor(t/3),alpha=Math.max(.12,1-.1*lvl);
  proj.forEach(p=>emoji('🌰',p.x,p.y,24,alpha,p.r));
  bushes.slice().sort((a,b)=>a.y-b.y).forEach(drawBush);
  // 플레이어
  const f=hurt>0&&Math.floor(clock*20)%2;
  emoji(f?'😵':'🦁',px,py,38);
  // 목숨
  ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.fillText('❤️ x'+lives,W-12,30);ctx.shadowBlur=0;
  drawBadge();
}

reset();
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  const target=Math.floor(t/20)%2;n+=(target-n)*Math.min(1,dt*2);
  if(st==='play')update(dt);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
